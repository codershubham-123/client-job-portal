<mat-card class="job-card">
  <div class="job-card-content">
    <div class="company-mark">{{ (job.company?.name ?? 'S').charAt(0) }}</div>

    <div class="job-info">
      <h3 class="job-title">{{ job.title }}</h3>
      <span class="featured-tag">Featured</span>

      <div class="job-meta">
        <span>{{ job.company?.name ?? 'Confidential Company' }}</span>
        <span>•</span>
        <span>{{ job.location ?? 'Location not specified' }}</span>
      </div>

      <p class="job-description">{{ job.description }}</p>
      <p class="job-salary">₹{{ job.minSalary }} – ₹{{ job.maxSalary }}</p>
    </div>

    <div class="job-action">
      <button mat-stroked-button>Save</button>
      <button mat-flat-button color="primary">Apply Now</button>
    </div>
  </div>
</mat-card>
